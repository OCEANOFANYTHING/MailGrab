name: Auto Merge PRs

# This workflow will only run when manually triggered using the "workflow_dispatch" event
on:
  workflow_dispatch:
    inputs:
      merge_limit:
        description: 'Maximum number of PRs to merge (default: 100)'
        required: false
        default: '100'
        type: string

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup GitHub CLI
        run: |
          # Install GitHub CLI using the official method
          type -p curl >/dev/null || sudo apt update && sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
        
      - name: Auto-merge PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LIMIT: ${{ github.event.inputs.merge_limit }}
          REPO: ${{ github.repository }}
        run: |
          echo "Starting auto-merge process for open PRs in $REPO (up to $MERGE_LIMIT PRs)"
          
          # First check if there are any open PRs at all
          ALL_OPEN_PRS=$(gh pr list --repo "$REPO" --state open --json number,title,mergeable,mergeStateStatus)
          OPEN_PR_COUNT=$(echo "$ALL_OPEN_PRS" | jq length)
          
          if [ "$OPEN_PR_COUNT" -eq 0 ]; then
            echo "No open PRs found in the repository."
            exit 0
          else
            echo "Found $OPEN_PR_COUNT open pull requests."
            
            # Log details about all open PRs
            echo "$ALL_OPEN_PRS" | jq -r '.[] | "PR #\(.number) - \(.title) - Mergeable: \(.mergeable) - Status: \(.mergeStateStatus)"'
          fi
          
          # Fetch mergeable PRs
          MERGEABLE_PRS=$(echo "$ALL_OPEN_PRS" | jq '[.[] | select(.mergeable == "MERGEABLE")]')
          MERGEABLE_COUNT=$(echo "$MERGEABLE_PRS" | jq length)
          
          echo "Found $MERGEABLE_COUNT PRs in a mergeable state."
          
          if [ "$MERGEABLE_COUNT" -eq 0 ]; then
            echo "No PRs are currently in a mergeable state. Common reasons include:"
            echo "- Required status checks haven't passed yet"
            echo "- PR has merge conflicts"
            echo "- PR requires approval reviews"
            exit 0
          fi
          
          # Counter for merged PRs
          MERGED_COUNT=0
          
          # Process each PR
          echo "$MERGEABLE_PRS" | jq -c '.[]' | while read -r PR && [ $MERGED_COUNT -lt $MERGE_LIMIT ]; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            
            echo "Processing PR #$PR_NUMBER: $PR_TITLE"
            
            # Check if PR can be merged and if all checks passed
            if gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable,mergeStateStatus | jq -e '.mergeable == true and .mergeStateStatus == "CLEAN"' > /dev/null; then
              echo "Merging PR #$PR_NUMBER..."
              if gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --merge; then
                echo "✅ Successfully merged PR #$PR_NUMBER"
                MERGED_COUNT=$((MERGED_COUNT + 1))
              else
                echo "❌ Failed to merge PR #$PR_NUMBER"
              fi
            else
              PR_STATUS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable,mergeStateStatus)
              echo "⚠️ PR #$PR_NUMBER is not ready to be merged:"
              echo "$PR_STATUS" | jq -r '"  Mergeable: \(.mergeable)\n  Status: \(.mergeStateStatus)"'
            fi
            
            # Small delay to avoid API rate limits
            sleep 2
          done
          
          echo "Completed auto-merge process. Merged $MERGED_COUNT PRs."
          
          if [ "$MERGED_COUNT" -eq 0 ]; then
            echo "No PRs were merged. If you have open PRs, ensure they:"
            echo "1. Have required status checks passing"
            echo "2. Are approved (if required)"
            echo "3. Have no merge conflicts"
            echo "4. Match branch protection rules"
          fi